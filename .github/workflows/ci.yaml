name: lint-and-test
permissions: {}
# No path filter. There was one, listing src, environments, the workflows and
# the two package files, and it had already fallen behind the repository: a
# pull request touching only react-router.config.ts skipped CI entirely, and
# that file holds `prerender`, whose removal is the exact regression
# tests/deep-link.test.ts exists to catch. tests/, tsconfig and the generated
# assets under public/ were outside it too.
#
# Keeping such a list correct means remembering to extend it every time the
# layout changes, and the cost of forgetting is a green pull request that was
# never checked. The whole job is a lint, a build and 41 tests, so running it
# on everything is cheaper than maintaining the list.
on:
  pull_request:
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOCKER_COMPOSE_DIRECTORY: environments/ci

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version info
        run: pwd && docker compose version && docker --version

      - name: Get UID/GID of the runner
        id: get_uid_gid
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Create and start docker container
        run: docker compose up -d
        working-directory: ${{ env.DOCKER_COMPOSE_DIRECTORY }}

      - name: Install dependencies
        run: docker compose exec -T frontend yarn install --immutable
        working-directory: ${{ env.DOCKER_COMPOSE_DIRECTORY }}

      - name: Run lint
        run: docker compose exec -T frontend yarn lint
        working-directory: ${{ env.DOCKER_COMPOSE_DIRECTORY }}

      # The deploy workflow builds the site, so build failures must be caught here as well.
      # Otherwise a pull request stays green and only the post-merge deploy fails.
      - name: Build
        run: docker compose exec -T frontend yarn build
        working-directory: ${{ env.DOCKER_COMPOSE_DIRECTORY }}

      # After the build, not before: the deep-link suite fetches from
      # build/client to check that /best-paper-award is prerendered to a file
      # of its own. Dropping it from `prerender` still builds cleanly and
      # would only show up as a 404 on a URL someone had already shared.
      - name: Test
        run: docker compose exec -T frontend yarn test
        working-directory: ${{ env.DOCKER_COMPOSE_DIRECTORY }}
